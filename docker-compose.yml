# Cały system: baza danych, API i serwer wejściowy (Caddy z frontendem).
#
#   docker compose up --build        # lokalnie: http://localhost:8080 (wartości domyślne niżej)
#   docker compose up -d --build     # na serwerze VPS: w tle, konfiguracja z pliku .env
#
# Wartości w ${NAZWA:-domyślna} pochodzą z pliku .env obok tego pliku (wzór: .env.example).
# Domyślne pozwalają uruchomić wszystko lokalnie bez żadnej konfiguracji. Na serwerze
# KAŻDĄ z nich ustaw w .env — instrukcja w DEPLOY.md.
name: petrace

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: petrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petrace}
      POSTGRES_DB: petrace
    volumes:
      # Dane bazy na wolumenie: przetrwają restart i aktualizację kontenerów.
      - db-data:/var/lib/postgresql/data
      # Schemat ładowany automatycznie przy pierwszym starcie pustej bazy.
      - ./server/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petrace -d petrace"]
      interval: 5s
      retries: 10
    # Brak sekcji `ports`: baza jest dostępna tylko dla innych kontenerów, nie z internetu.

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://petrace:${POSTGRES_PASSWORD:-petrace}@db:5432/petrace
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DEMO_LOGIN: ${DEMO_LOGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-PetTrace <no-reply@petracker.pl>}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    build: .
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      # Na serwerze w .env: HTTP_PORT=80 i HTTPS_PORT=443 (wymagane do certyfikatu HTTPS).
      # Lokalnie 8080/8443, żeby nie kolidować z innymi programami na komputerze.
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # Certyfikaty HTTPS — na wolumenie, żeby Caddy nie pobierał ich od nowa przy każdym restarcie.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
